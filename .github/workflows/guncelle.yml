name: Günlük güncelleme

on:
  schedule:
    - cron: "30 4 * * *"   # 07:30 Türkiye saati; sabahki uydu geçişleri genelde birkaç saat içinde arşive düşer
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç gün geriye bakılsın"
        default: "20"
      gorsel:
        description: "Tüm görselleri yeniden üret (evet/hayır)"
        default: "hayır"
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Yeni uydu görüntülerini ölç
        if: github.event_name != 'push'
        run: python cek.py --gun "${{ github.event.inputs.gun || '20' }}"
      - name: Site verisini ve görselleri üret
        if: github.event_name != 'push'
        run: python uret.py ${{ github.event.inputs.gorsel == 'evet' && '--gorsel' || '' }}
      - name: Değişiklik varsa kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri site/veri site/gorsel
          if git diff --cached --quiet; then
            echo "değişiklik yok"
          else
            git commit -m "Veri: $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: yayin
        uses: actions/deploy-pages@v4
